version: "3"

services:
  db:
    image: postgres:16
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    container_name: test1-back
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: